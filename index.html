<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Portfolio OS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Desktop area -->
  <div id="desktopArea">
    <!-- Desktop icons -->
    <div class="desktop-icon" onclick="openProjectsWindow()">
      <img src="icons/folder.png" alt="Projects">
      <span>Projects</span>
    </div>
    <div class="desktop-icon" onclick="openAboutWindow()">
      <img src="icons/ie.png" alt="About">
      <span>About Me</span>
    </div>
    <div class="desktop-icon" onclick="openContactWindow()">
      <img src="icons/outlook.png" alt="Contact">
      <span>Contact</span>
    </div>
  </div>

  <!-- Taskbar -->
  <div id="taskbar"></div>

  <script src="script.js"></script>
</body>
</html>
