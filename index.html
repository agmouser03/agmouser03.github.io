<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Windows UI Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Desktop icons -->
  <div class="desktop">
    <div class="icon" onclick="openWindow('About Me')">
      <img src="https://via.placeholder.com/48" alt="About">
      <span>About Me</span>
    </div>
    <div class="icon" onclick="openWindow('Projects')">
      <img src="https://via.placeholder.com/48" alt="Projects">
      <span>Projects</span>
    </div>
    <div class="icon" onclick="openWindow('Contact')">
      <img src="https://via.placeholder.com/48" alt="Contact">
      <span>Contact</span>
    </div>
  </div>

  <!-- Container where windows get injected -->
  <div id="desktopArea"></div>

  <!-- Taskbar for minimized windows -->
  <div id="taskbar"></div>

  <!-- Script at bottom so HTML loads first -->
  <script src="script.js"></script>
</body>
</html>
