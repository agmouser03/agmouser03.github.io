<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Windows UI Portfolio</title>
  <!-- Link to external CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Desktop icons (you can add more here) -->
  <div class="desktop">
    <div class="icon" onclick="openWindow('About Me')">
      <!-- Replace src with your own image -->
      <img src="https://via.placeholder.com/48" alt="About">
      <span>About Me</span>
    </div>
    <div class="icon" onclick="openWindow('Projects')">
      <img src="https://via.placeholder.com/48" alt="Projects">
      <span>Projects</span>
    </div>
    <div class="icon" onclick="openWindow('Contact')">
      <img src="https://via.placeholder.com/48" alt="Contact">
      <span>Contact</span>
    </div>
  </div>

  <!-- Main window (stays the same, only content changes) -->
  <div class="window" id="window">
    <div class="title-bar" id="titleBar">
      <span id="windowTitle">Windows Media Player - Portfolio</span>
      <div class="title-buttons">
        <div class="title-button">_</div>
        <div class="title-button">□</div>
        <div class="title-button">X</div>
      </div>
    </div>
    <div class="content" id="windowContent">
      <h2>Welcome to My Portfolio</h2>
      <p>This is where your content goes. Click the desktop icons to navigate.</p>
    </div>
  </div>

  <!-- Link to external JavaScript -->
  <script src="script.js"></script>
</body>
</html>
