<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Windows UI Portfolio</title>
  <style>
    body {
      background: #1c5fad url('https://i.imgur.com/E1Idy8Y.png'); /* XP-style bg */
      background-size: cover;
      font-family: Tahoma, sans-serif;
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Window container */
    .window {
      width: 600px;
      background: #ece9d8;
      border: 2px solid #000080;
      box-shadow: 5px 5px 10px rgba(0,0,0,0.5);
      position: absolute;
    }

    /* Title bar */
    .title-bar {
      background: linear-gradient(#0a246a, #3a6ea5);
      color: white;
      padding: 4px 8px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: move;
      user-select: none;
    }

    /* Title bar buttons */
    .title-buttons {
      display: flex;
      gap: 4px;
    }

    .title-button {
      width: 16px;
      height: 16px;
      background: #ece9d8;
      border: 1px solid #000;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 12px;
      cursor: pointer;
    }

    /* Content area */
    .content {
      background: #fff;
      height: 400px;
      padding: 16px;
      overflow: auto;
    }
  </style>
</head>
<body>
  <div class="window" id="window">
    <div class="title-bar" id="titleBar">
      <span>Windows Media Player - Portfolio</span>
      <div class="title-buttons">
        <div class="title-button">_</div>
        <div class="title-button">□</div>
        <div class="title-button">X</div>
      </div>
    </div>
    <div class="content">
      <h2>Welcome to My Portfolio</h2>
      <p>This is where your content goes. You can add tabs, media player styling, or project details here.</p>
    </div>
  </div>

  <script>
    // Dragging logic
    const windowEl = document.getElementById("window");
    const titleBar = document.getElementById("titleBar");

    let isDragging = false;
    let offsetX, offsetY;

    titleBar.addEventListener("mousedown", (e) => {
      isDragging = true;
      offsetX = e.clientX - windowEl.offsetLeft;
      offsetY = e.clientY - windowEl.offsetTop;
    });

    document.addEventListener("mousemove", (e) => {
      if (isDragging) {
        windowEl.style.left = (e.clientX - offsetX) + "px";
        windowEl.style.top = (e.clientY - offsetY) + "px";
      }
    });

    document.addEventListener("mouseup", () => {
      isDragging = false;
    });
  </script>
</body>
</html>
