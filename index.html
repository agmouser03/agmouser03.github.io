<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Y2K Portfolio</title>
</head>
<body style="margin:0; font-family:Arial, sans-serif; background:#eec0c6;">

  <!-- FLOATING NAVIGATION BAR -->
  <header style="width:100%; display:flex; justify-content:center; margin-top:20px;">
    <nav style="background:#ffcc33; border:4px solid #ff6699; border-radius:12px; box-shadow:4px 4px 0px #663399; display:flex; align-items:center; gap:20px; padding:10px 20px;">
      
      <!-- Logo -->
      <img src="logo.png" alt="Logo" style="height:40px;">
      
      <!-- Nav Links -->
      <a href="#" style="text-decoration:none; background:#ff6699; color:white; padding:8px 16px; border-radius:8px; font-weight:bold;">Home</a>
      <a href="#" style="text-decoration:none; background:#ff6699; color:white; padding:8px 16px; border-radius:8px; font-weight:bold;">Projects</a>
      <a href="#" style="text-decoration:none; background:#ff6699; color:white; padding:8px 16px; border-radius:8px; font-weight:bold;">About</a>
      <a href="#" style="text-decoration:none; background:#ff6699; color:white; padding:8px 16px; border-radius:8px; font-weight:bold;">Contact</a>
    </nav>
  </header>

  <!-- MAIN CONTENT AREA -->
  <main style="display:flex; justify-content:center; align-items:center; height:calc(100vh - 120px);">
    <div style="width:70%; max-width:800px; height:70%; background:#fdf1d6; border:4px solid #d4b483; border-radius:12px; box-shadow:6px 6px 0px #663399; display:flex; justify-content:center; align-items:center; text-align:center; padding:20px;">
      <p style="font-size:1.2rem; color:#333;">This is the main content area. Each page’s content will load here!</p>
    </div>
  </main>

</body>
</html>
